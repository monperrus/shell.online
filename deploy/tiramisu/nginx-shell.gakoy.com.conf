# shell.gakoy.com — the self-hosted shell.online relay on tiramisu.
#
# nginx terminates TLS and proxies everything to the worker, which runs on
# 127.0.0.1:8788 and is not reachable from outside this machine.
#
# The map is named rather than the conventional $connection_upgrade because
# mail.gakoy.com.conf already defines that one in the http context, and two
# maps with the same name are a configuration error. Defining our own also
# means this vhost keeps working if that file is ever disabled.
map $http_upgrade $shell_online_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name shell.gakoy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shell.gakoy.com;

    ssl_certificate     /etc/letsencrypt/live/shell.gakoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shell.gakoy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Terminal frames are small and constant; a proxy that batches them adds
    # latency to every keystroke for no gain.
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shell_online_connection_upgrade;

        # A shared terminal holds its websocket open for as long as the
        # session lives. The relay's own lease is 12 hours, so anything
        # shorter here would close sessions the relay still considers live.
        proxy_read_timeout 43200s;
        proxy_send_timeout 43200s;
    }
}
