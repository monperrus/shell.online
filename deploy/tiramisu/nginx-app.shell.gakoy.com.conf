# app.shell.gakoy.com — the self-hosted accounts app on tiramisu.
#
# The relay (shell.gakoy.com) and the accounts app are two services and need
# two hostnames: the relay's worker claims "/", "/api/*" and "/s/*", so there
# is no path under it the app could live at.
#
# nginx terminates TLS and proxies to the compose stack on 127.0.0.1:8083,
# which serves the React client and the API together and proxies /relay/* to
# the relay itself.
map $http_upgrade $shell_online_app_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.shell.gakoy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.shell.gakoy.com;

    ssl_certificate     /etc/letsencrypt/live/app.shell.gakoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.shell.gakoy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shell_online_app_connection_upgrade;

        # /relay/* carries terminal websockets through to the relay, so this
        # needs the relay's own timeout rather than a default one.
        proxy_read_timeout 43200s;
        proxy_send_timeout 43200s;
        proxy_buffering off;
    }
}
