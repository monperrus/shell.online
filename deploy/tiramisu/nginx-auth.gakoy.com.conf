# auth.gakoy.com — Keycloak, which holds the accounts.
#
# Its own hostname rather than a path under the app: Keycloak puts this address
# in the issuer of every token it signs and in its discovery document, and both
# have to be the address browsers actually use.
#
# nginx terminates TLS and Keycloak is told so through X-Forwarded-Proto
# (KC_PROXY_HEADERS=xforwarded). Without that it sees plain HTTP, decides the
# deployment is insecure, and refuses to serve anything but localhost.

server {
    listen 80;
    listen [::]:80;
    server_name auth.gakoy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.gakoy.com;

    ssl_certificate     /etc/letsencrypt/live/auth.gakoy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.gakoy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keycloak's admin console posts large forms, and a realm import through
    # the console is larger still.
    client_max_body_size 20m;

    # The management port is not exposed here. /health and /metrics live on
    # 9000 inside the container and have no business being public.
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }
}
